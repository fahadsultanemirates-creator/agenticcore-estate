<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="auth.css">
</head>
<body data-page="signup">

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="Home">
      <img src="images/agenticcore-icon.png" alt="AgenticCore" class="nav-logo-icon">
    </a>
    <h1 data-i18n="auth_signup_title"></h1>
    <p class="auth-sub" data-i18n="auth_signup_sub"></p>

    <div class="auth-error" id="authError"></div>

    <form id="signupForm">
      <div class="field-group">
        <label data-i18n="field_account_type"></label>
        <div class="role-choice role-choice-4">
          <label class="role-option checked"><input type="radio" name="role" value="buyer" checked> <span data-i18n="role_buyer"></span></label>
          <label class="role-option"><input type="radio" name="role" value="agency"> <span data-i18n="role_agency"></span></label>
          <label class="role-option"><input type="radio" name="role" value="developer"> <span data-i18n="role_project"></span></label>
          <label class="role-option"><input type="radio" name="role" value="builder"> <span data-i18n="role_builder"></span></label>
        </div>
        <span class="hint" id="roleHint" style="display:block;margin-top:0.4rem;"></span>
      </div>
      <div class="field-group">
        <label for="fullName" data-i18n="field_full_name"></label>
        <input type="text" id="fullName" required autocomplete="name">
      </div>
      <div class="field-group">
        <label for="phone" data-i18n="field_phone"></label>
        <input type="tel" id="phone" required autocomplete="tel" placeholder="+92 3XX XXXXXXX">
      </div>
      <div class="field-group">
        <label for="email" data-i18n="field_email"></label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field-group">
        <label for="password" data-i18n="field_password"></label>
        <input type="password" id="password" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field-group">
        <label for="referralCode" data-i18n="field_referral_code"></label>
        <input type="text" id="referralCode" placeholder="e.g. AYESHA88">
      </div>
      <button type="submit" class="btn btn-primary" id="signupBtn" data-i18n="auth_signup_btn"></button>
    </form>

    <p class="auth-footer"><span data-i18n="auth_has_account"></span> <a href="login.html" data-i18n="auth_login_link"></a></p>
    <p style="text-align:center;margin-top:var(--space-md);">
      <a href="index.html" class="btn btn-primary btn-sm auth-home-btn">Home</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="i18n.js"></script>
<script src="auth.js"></script>
<script>
  const ROLE_HINTS = {
    buyer: 'Shared dashboard for renting or selling your own property — choose rent or sale per listing.',
    agency: 'Manage your agency\'s listings and your agency profile from one dashboard. Your logo shows on your listings automatically.',
    developer: 'List a whole project or society — units/plots, size and price ranges, payment plan, and a brochure upload, on the next step.',
    builder: 'Promotion-only dashboard for builders and developers — company profile, logo, and services. No property listings from this account.'
  };
  document.addEventListener('DOMContentLoaded', function () {
    const refCode = new URLSearchParams(window.location.search).get('ref');
    if (refCode) document.getElementById('referralCode').value = refCode;
    const hintEl = document.getElementById('roleHint');
    function updateHint() {
      const checked = document.querySelector('.role-option input:checked');
      if (hintEl && checked) hintEl.textContent = ROLE_HINTS[checked.value] || '';
    }
    document.querySelectorAll('.role-option input').forEach(function (input) {
      input.addEventListener('change', function () {
        document.querySelectorAll('.role-option').forEach(function (o) { o.classList.remove('checked'); });
        input.closest('.role-option').classList.add('checked');
        updateHint();
      });
    });
    updateHint();
  });
</script>
</body>
</html>
