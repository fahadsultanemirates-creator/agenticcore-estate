<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Set your password — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="auth.css">
<script src="ac-analytics.js"></script>
<script src="ac-back.js" defer></script>
</head>
<body data-page="set-password">

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="Home">
      <img src="images/agenticcore-logo-stacked-light.png" alt="AgenticCore.estate" class="auth-logo-img" width="200" height="151">
    </a>
    <h1 data-i18n="sp_title"></h1>
    <p class="auth-sub" data-i18n="sp_sub"></p>

    <div class="auth-error" id="authError" role="alert"></div>

    <form id="spForm" hidden novalidate>
      <div class="field-group">
        <label for="spNew" data-i18n="sp_new"></label>
        <input type="password" id="spNew" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field-group">
        <label for="spConfirm" data-i18n="sp_confirm"></label>
        <input type="password" id="spConfirm" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="spBtn" data-i18n="sp_btn"></button>
    </form>

    <p style="text-align:center;margin-top:var(--space-md);">
      <a href="login.html" class="btn btn-secondary btn-sm" id="spLogin" hidden data-i18n="auth_login_btn"></a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="ac-cities.js"></script>
<script src="i18n.js"></script>
<script>
// Opened from the one-time sign-in link the Telegram bot sends: supabase-js
// reads the session from the link, then the person chooses a password.
(async function () {
  const err = document.getElementById('authError');
  const form = document.getElementById('spForm');
  function show(text, ok) {
    err.textContent = text; err.style.display = 'block';
    err.style.background = ok ? 'rgba(16,185,129,0.1)' : ''; err.style.color = ok ? '#34D399' : '';
  }
  const { data } = await supabaseClient.auth.getSession();
  // the link's tokens are in the address bar fragment; drop them once read
  if (location.hash) history.replaceState(null, '', location.pathname);
  if (!data || !data.session) {
    show(acT('sp_expired'));
    document.getElementById('spLogin').hidden = false;
    return;
  }
  form.hidden = false;
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const a = document.getElementById('spNew').value, b = document.getElementById('spConfirm').value;
    if (a.length < 8) { show(acT('sp_short')); return; }
    if (a !== b) { show(acT('sp_mismatch')); return; }
    const btn = document.getElementById('spBtn');
    btn.disabled = true; btn.textContent = acT('sp_saving');
    const r = await supabaseClient.auth.updateUser({ password: a });
    if (r.error) { btn.disabled = false; btn.textContent = acT('sp_btn'); show(r.error.message); return; }
    show(acT('sp_done'), true);
    setTimeout(function () { location.href = 'my.html#account'; }, 1200);
  });
})();
</script>
<script src="pw-toggle.js" defer></script>
<script src="ac-amaan-float.js" defer></script>
</body>
</html>
