<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#071f17">
<title>Log in — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="auth.css">
<script src="ac-analytics.js"></script>
<script src="ac-back.js" defer></script>
</head>
<body data-page="login">

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="Home">
      <img src="images/agenticcore-icon.png" alt="AgenticCore" class="nav-logo-icon">
    </a>
    <h1 data-i18n="auth_login_title"></h1>
    <p class="auth-sub" data-i18n="auth_login_sub"></p>

    <div class="auth-error" id="authError"></div>

    <div class="auth-newhere" id="authNewHere" hidden>
      <p data-i18n="auth_new_here"></p>
      <a href="signup.html" class="btn btn-secondary" id="authNewHereBtn" data-i18n="auth_new_btn"></a>
    </div>

    <form id="loginForm">
      <div class="field-group">
        <label for="identifier">Phone number or email</label>
        <input type="text" id="identifier" required placeholder="+92 3XX XXXXXXX or you@email.com">
      </div>
      <div class="field-group">
        <label for="password" data-i18n="field_password"></label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn" data-i18n="auth_login_btn"></button>
    </form>

    <p class="auth-footer"><button type="button" class="auth-maillink" id="mailLinkBtn" data-i18n="auth_maillink"></button></p>
    <p class="auth-footer"><span data-i18n="auth_no_account"></span> <a href="signup.html" id="loginToSignup" data-i18n="auth_create_one"></a></p>
    <p style="text-align:center;margin-top:var(--space-md);">
      <a href="index.html" class="btn btn-primary btn-sm auth-home-btn">Home</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="ac-cities.js"></script>
<script src="i18n.js"></script>
<script src="auth.js"></script>
<script src="ac-phone.js" defer></script>
<script src="pw-toggle.js" defer></script>
</body>
</html>
