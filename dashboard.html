<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#071f17">
<script>/* Marketplace V2: one dashboard for every account — this page is kept for old links */ location.replace('my.html#properties');</script>

<title>Dashboard — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="inner.css">
<link rel="stylesheet" href="product2.css">
<script src="ac-analytics.js"></script>
<script src="ac-back.js" defer></script>
</head>
<body data-page="dashboard">

<div class="dash-shell" id="dashRoot">
  <aside class="dash-sidebar">
    <a href="index.html" class="nav-logo"><img src="images/agenticcore-logo.png" alt="AgenticCore.estate" class="nav-logo-img" width="196" height="40"></a>
    <ul class="dash-nav">
      <li><a href="dashboard.html" class="active">Overview</a></li>
      <li><a href="sell.html">List a property</a></li>
      <li><a href="referral-dashboard.html">Referrals</a></li>
      <li><a href="buy.html">Browse listings</a></li>
      <li><a href="index.html">Back to site</a></li>
      <li><a href="#" id="dashLogout">Log out</a></li>
    </ul>
  </aside>
  <main class="dash-main">
    <div class="dash-header">
      <h1>Welcome, <span id="dashName">—</span></h1>
      <a href="sell.html" class="btn btn-primary btn-sm">+ List a property</a>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><span class="stat-label">My listings</span><div class="stat-value" id="dashListingCount">0</div></div>
      <div class="stat-card"><span class="stat-label">AgenticCore Points</span><div class="stat-value" id="dashPoints">0</div></div>
      <div class="stat-card"><span class="stat-label">Referral code</span><div class="stat-value" id="dashReferralCode" style="font-size:1.1rem;">—</div></div>
      <div class="stat-card"><span class="stat-label">Direct referrals</span><div class="stat-value" id="dashReferralCount">0</div></div>
    </div>

    <div class="panel">
      <h3>My listings</h3>
      <table class="data-table">
        <thead><tr><th>Title</th><th>Type</th><th>Price</th><th>Status</th><th>Quality</th><th></th></tr></thead>
        <tbody id="dashListingsBody"></tbody>
      </table>
    </div>

    <h3 style="margin:var(--space-lg) 0 var(--space-sm);">Listing packages</h3>
    <div id="dashPackageGrid"></div>

    <div class="panel" id="referralJoinPanel">
      <h3>Referral program</h3>
      <p id="referralJoinCopy" style="color:var(--text-secondary);font-size:0.9rem;"></p>
      <button class="btn btn-primary btn-sm" id="referralJoinBtn">Join the referral program</button>
      <a href="referral-dashboard.html" class="btn btn-secondary btn-sm" id="referralOpenBtn" style="display:none;">Open referral dashboard →</a>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="ac-cities.js"></script>
<script src="i18n.js"></script>
<script src="listings.js"></script>
<script src="listing-quality.js"></script>
<script src="ai-placeholders.js"></script>
<script src="auth.js"></script>
<script src="referral-cta.js"></script>
<script src="dashboard.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('dashLogout').addEventListener('click', async function (e) {
      e.preventDefault(); await AcDB.logOut(); window.location.href = 'index.html';
    });
    acMountPropertyAdvisor();
  });
</script>
</body>
</html>
