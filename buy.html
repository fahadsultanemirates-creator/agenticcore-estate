<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Property — AgenticCore Estate</title>
<meta name="description" content="Browse buy listings across Islamabad and Rawalpindi — filter by property type, city, and price.">
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="inner.css">
</head>
<body data-page="buy">

<div id="site-header"></div>

<header class="inner-hero">
  <div class="container">
    <span class="hero-eyebrow"><span class="dot"></span> <span data-i18n="search_buy"></span></span>
    <h1>Buy property in Islamabad &amp; Rawalpindi</h1>
    <p class="hero-sub">Developer listings alongside individual sellers — filter to find the right fit.</p>
  </div>
</header>

<section style="padding-top:var(--space-lg);">
  <div class="container">
    <div class="listing-toolbar">
      <span class="listing-count" id="listingCount"></span>
    </div>
    <div class="listing-layout">
      <aside class="filter-panel">
        <h4>Filters</h4>
        <div class="filter-group">
          <label data-i18n="search_keyword_ph" style="font-size:0.85rem;color:var(--text-secondary);"></label>
          <input type="text" id="filterQuery" data-i18n-ph="search_keyword_ph">
        </div>
        <div class="filter-group">
          <label style="font-size:0.85rem;color:var(--text-secondary);">Property type</label>
          <select id="filterPropertyType"><option value="">Any property type</option></select>
        </div>
        <div class="filter-group">
          <label data-i18n="search_city" style="font-size:0.85rem;color:var(--text-secondary);"></label>
          <select id="filterCity"><option value="" data-i18n="search_any_city"></option></select>
        </div>
        <div class="filter-group">
          <label data-i18n="search_price" style="font-size:0.85rem;color:var(--text-secondary);"></label>
          <input type="number" id="filterMaxPrice" placeholder="e.g. 40000000">
        </div>
        <div class="filter-group">
          <label style="font-size:0.85rem;color:var(--text-secondary);">Minimum bedrooms</label>
          <select id="filterBeds">
            <option value="">Any</option>
            <option value="1">1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
            <option value="4">4+</option>
          </select>
        </div>
      </aside>
      <div class="listing-grid" id="listingGrid"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="property-taxonomy.js"></script>
<script src="i18n.js"></script>
<script src="listings.js"></script>
<script src="ai-placeholders.js"></script>
<script src="partials.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    acInitListingPage('buy');
    acMountPropertyAdvisor();
  });
</script>
</body>
</html>
