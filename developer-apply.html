<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Application — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="inner.css">
</head>
<body data-page="developer-apply">

<div id="site-header"></div>

<header class="inner-hero">
  <div class="container">
    <span class="hero-eyebrow"><span class="dot"></span> Step 2 of 2</span>
    <h1>Set up your developer account</h1>
    <p class="hero-sub">Add your company details and choose a project package to get listing right away.</p>
  </div>
</header>

<section class="deep-section" style="padding-top:var(--space-lg);">
  <div class="container narrow">
    <div class="panel" style="padding:var(--space-lg);">
      <div class="auth-error" id="authError" style="display:none;background:rgba(226,114,107,0.1);border:1px solid rgba(226,114,107,0.35);color:#F0958E;font-size:0.85rem;padding:0.7rem 0.9rem;border-radius:8px;margin-bottom:1rem;"></div>
      <form id="devApplyForm">
        <div class="form-grid">
          <div class="form-field">
            <label for="companyName">Company / agency name</label>
            <input type="text" id="companyName" required placeholder="e.g. Bilal Developments">
          </div>
          <div class="form-field">
            <label for="devPhone">Business phone number</label>
            <input type="tel" id="devPhone" required placeholder="+92 3XX XXXXXXX">
          </div>
        </div>
        <div class="form-field">
          <label>Choose a project package</label>
          <span class="hint" style="display:block;margin:-0.2rem 0 0.6rem;">These are project packages, not single-unit listings — see <a href="developer-packages.html" style="color:var(--accent-gold-bright);">full package details</a>.</span>
          <div class="tier-table tier-table-4" style="margin:0.6rem 0 0;">
            <label class="tier-card" style="cursor:pointer;display:block;">
              <input type="radio" name="tier" value="1" checked style="display:none;">
              <div class="tier-card-brand"><span>AgenticCore Estate</span><svg viewBox="0 0 100 100" fill="none"><polygon points="50,8 88,29 88,71 50,92 12,71 12,29" stroke="#3FAE7B" stroke-width="6"/></svg></div>
              <span class="tier-name">Launch</span>
              <div class="tier-price">Rs 15,000<span class="period">/mo</span></div>
              <p style="font-size:0.85rem;color:var(--text-secondary);">Up to 3 projects</p>
            </label>
            <label class="tier-card featured" style="cursor:pointer;display:block;">
              <input type="radio" name="tier" value="2" style="display:none;">
              <div class="tier-card-brand"><span>AgenticCore Estate</span><svg viewBox="0 0 100 100" fill="none"><polygon points="50,8 88,29 88,71 50,92 12,71 12,29" stroke="#D4AF37" stroke-width="6"/></svg></div>
              <span class="tier-name">Growth</span>
              <div class="tier-price">Rs 50,000<span class="period">/mo</span></div>
              <p style="font-size:0.85rem;color:var(--text-secondary);">Up to 10 projects, social content &amp; brochures free</p>
            </label>
            <label class="tier-card tier-elite" style="cursor:pointer;display:block;">
              <input type="radio" name="tier" value="3" style="display:none;">
              <div class="tier-card-brand"><span>AgenticCore Estate</span><svg viewBox="0 0 100 100" fill="none"><polygon points="50,8 88,29 88,71 50,92 12,71 12,29" stroke="#F0CE63" stroke-width="6"/></svg></div>
              <span class="tier-name">Scale</span>
              <div class="tier-price">Rs 200,000<span class="period">/mo</span></div>
              <p style="font-size:0.85rem;color:var(--text-secondary);">Up to 20 projects, top placement</p>
            </label>
            <label class="tier-card tier-custom" style="cursor:pointer;display:block;">
              <input type="radio" name="tier" value="4" style="display:none;">
              <div class="tier-card-brand"><span>AgenticCore Estate</span><svg viewBox="0 0 100 100" fill="none"><polygon points="50,8 88,29 88,71 50,92 12,71 12,29" stroke="#F4EFE0" stroke-width="6"/></svg></div>
              <span class="tier-name">Business Pool</span>
              <div class="tier-price">Custom</div>
              <p style="font-size:0.85rem;color:var(--text-secondary);">Unlimited, full marketing partnership</p>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem;">Create developer account</button>
      </form>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="i18n.js"></script>
<script src="ai-placeholders.js"></script>
<script src="partials.js"></script>
<script src="auth.js"></script>
<script src="developer.js"></script>
</body>
</html>
