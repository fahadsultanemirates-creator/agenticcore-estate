<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#071f17">
<title>Listing Toolkit — AgenticCore Estate</title>
<meta name="description" content="Share cards, QR code, captions and a quality report for your AgenticCore Estate listing.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="inner.css">
<link rel="stylesheet" href="product2.css">
<script src="ac-analytics.js"></script>

<body data-page="toolkit">

<div id="site-header"></div>

<header class="inner-hero">
  <div class="container">
    <span class="hero-eyebrow"><span class="dot"></span> <span data-i18n="tk_eyebrow">Free Listing Toolkit</span></span>
    <h1 data-i18n="tk_h1">Market this listing</h1>
    <p class="hero-sub" data-i18n="tk_sub">Cards, a QR code and captions made from your listing's own details — free for your listings.</p>
  </div>
</header>

<section class="deep-section" style="padding-top:var(--space-lg);">
  <div class="container" style="max-width:1040px;" id="toolkitRoot">
    <div class="panel" role="status" data-i18n="tk_loading">Loading your listing…</div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>

<script src="partials.js"></script>
<script src="auth.js"></script>
<script src="toolkit.js"></script>

</html>
