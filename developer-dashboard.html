<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Dashboard — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="inner.css">
</head>
<body data-page="developer-dashboard">

<div class="dash-shell" id="devDashRoot">
  <aside class="dash-sidebar">
    <a href="index.html" class="nav-logo"><svg viewBox="0 0 100 100" fill="none"><polygon points="50,8 88,29 88,71 50,92 12,71 12,29" stroke="#22D3EE" stroke-width="4"/><polygon points="50,28 70,40 70,60 50,72 30,60 30,40" stroke="#3B82F6" stroke-width="3"/></svg>Agentic<span class="brand-suffix">Estate</span></a>
    <ul class="dash-nav">
      <li><a href="developer-dashboard.html" class="active">Overview</a></li>
      <li><a href="sell.html">Post a listing</a></li>
      <li><a href="pricing.html">Change package</a></li>
      <li><a href="business-pool.html">Business Pool</a></li>
      <li><a href="developer-corner.html">Agency services</a></li>
      <li><a href="index.html">Back to site</a></li>
      <li><a href="#" id="devLogout">Log out</a></li>
    </ul>
  </aside>
  <main class="dash-main">
    <div class="dash-header">
      <h1>Welcome, <span id="devName">—</span></h1>
      <a href="sell.html" class="btn btn-primary btn-sm">+ Post a listing</a>
    </div>

    <div class="package-card" id="devPackageCard">
      <div class="package-card-top">
        <div>
          <div class="package-card-brand">AgenticCore Estate — Active Package</div>
          <div class="package-card-tier" id="devTierBadge">—</div>
        </div>
        <div class="package-card-price" id="devTierPrice">—</div>
      </div>
      <div>
        <div class="package-card-quota"><strong id="devListingCount">0</strong> of <span id="devListingCap">—</span> listings used<span id="devVerifiedNote"></span></div>
        <div class="package-card-bar"><div class="package-card-bar-fill" id="devQuotaBar" style="width:0%;"></div></div>
      </div>
    </div>

    <div class="panel">
      <h3>My listings</h3>
      <table class="data-table">
        <thead><tr><th>Title</th><th>City</th><th>Price</th><th>Status</th></tr></thead>
        <tbody id="devListingsBody"></tbody>
      </table>
    </div>

    <div class="form-grid" id="devAiSlot"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="property-taxonomy.js"></script>
<script src="i18n.js"></script>
<script src="listings.js"></script>
<script src="ai-placeholders.js"></script>
<script src="auth.js"></script>
<script src="developer.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('devLogout').addEventListener('click', async function (e) {
      e.preventDefault(); await AcDB.logOut(); window.location.href = 'index.html';
    });
    acMountPropertyAdvisor();
  });
</script>
</body>
</html>
