<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#071f17">
<title>Admin Sign In — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="auth.css">
</head>
<body data-page="admin-login">

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="Home">
      <img src="images/agenticcore-icon.png" alt="AgenticCore" class="nav-logo-icon">
    </a>
    <h1 data-i18n="admin_login_title"></h1>
    <p class="auth-sub" data-i18n="admin_login_sub"></p>

    <div class="auth-error" id="authError"></div>

    <form id="adminLoginForm">
      <div class="field-group">
        <label for="identifier">Admin email</label>
        <input type="text" id="identifier" required placeholder="admin@agenticcore.estate">
      </div>
      <div class="field-group">
        <label for="password" data-i18n="field_password"></label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <p style="text-align:center;margin-top:var(--space-md);">
      <a href="index.html" class="btn btn-primary btn-sm auth-home-btn">Home</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="i18n.js"></script>
<script src="admin.js"></script>
</body>
</html>
