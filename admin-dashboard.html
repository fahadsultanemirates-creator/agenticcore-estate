<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — AgenticCore Estate</title>
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="inner.css">
</head>
<body data-page="admin-dashboard">

<div class="dash-shell" id="adminRoot">
  <aside class="dash-sidebar">
    <a href="index.html" class="nav-logo"><svg viewBox="0 0 100 100" fill="none"><polygon points="50,8 88,29 88,71 50,92 12,71 12,29" stroke="#22D3EE" stroke-width="4"/><polygon points="50,28 70,40 70,60 50,72 30,60 30,40" stroke="#3B82F6" stroke-width="3"/></svg>Agentic<span class="brand-suffix">Estate</span></a>
    <ul class="dash-nav">
      <li><a href="admin-dashboard.html" class="active">Review queue</a></li>
      <li><a href="index.html">Back to site</a></li>
      <li><a href="#" id="adminLogout">Log out</a></li>
    </ul>
  </aside>
  <main class="dash-main">
    <div class="dash-header">
      <h1>Admin panel</h1>
      <span class="badge badge-gold">Reviewer access</span>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><span class="stat-label">Pending applications</span><div class="stat-value" id="adminPendingCount">0</div></div>
      <div class="stat-card"><span class="stat-label">Approved developers</span><div class="stat-value" id="adminDevCount">0</div></div>
      <div class="stat-card"><span class="stat-label">Total users</span><div class="stat-value" id="adminUserCount">0</div></div>
      <div class="stat-card"><span class="stat-label">Total listings</span><div class="stat-value" id="adminListingCount">0</div></div>
    </div>

    <div class="panel">
      <h3>Pending developer document review</h3>
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Company / tier</th><th>Phone</th><th>CNIC</th><th>Documents</th><th>Submitted</th><th>SLA</th><th>Action</th></tr></thead>
        <tbody id="adminPendingBody"></tbody>
      </table>
      </div>
    </div>

    <div class="panel">
      <h3>Decision history</h3>
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Company</th><th>Tier</th><th>Decision</th><th>Date</th><th>Note</th></tr></thead>
        <tbody id="adminHistoryBody"></tbody>
      </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="db-client.js"></script>
<script src="i18n.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('adminLogout').addEventListener('click', async function (e) {
      e.preventDefault(); await AcDB.logOut(); window.location.href = 'index.html';
    });
  });
</script>
</body>
</html>
